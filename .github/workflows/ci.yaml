name: ci

on:
  pull_request:
    branches: [ "main", "develop" ]
  # feature ブランチへの push は PR 側で検証するため、統合先ブランチのみを対象にする
  # （push と pull_request の二重起動を防ぐ）
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

# CI は読み取りのみで完結する
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.filter.outputs.package }}
      example: ${{ steps.filter.outputs.example }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            package:
              - 'pubspec.yaml'
              - 'analysis_options.yaml'
              - 'lib/**'
              - 'test/**'
              - '.github/workflows/ci.yaml'
            example:
              - 'example/**'
              - '.github/workflows/ci.yaml'
            ios:
              - 'example/ios/**'
              - 'pubspec.yaml'
              - 'example/pubspec.yaml'
              - '.github/workflows/ci.yaml'

  package:
    name: package (${{ matrix.flutter }} / ${{ matrix.resolution }})
    needs: changes
    if: needs.changes.outputs.package == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 意味のある境界のみを検証する
        #   3.24.x/min : pubspec で宣言した下限環境そのもの
        #   3.24.x/max : 下限 SDK のユーザーが pub upgrade した状態（依存が SDK 下限を割っていないか）
        #   3.47.x/max : 新規ユーザーが実際に取得する現行環境
        include:
          - flutter: '3.24.x'
            resolution: 'min'
          - flutter: '3.24.x'
            resolution: 'max'
          - flutter: '3.47.x'
            resolution: 'max'
            format: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - name: Resolve (min)
        if: matrix.resolution == 'min'
        run: flutter pub downgrade
      - name: Resolve (max)
        if: matrix.resolution == 'max'
        run: flutter pub upgrade
      # dart format の整形結果は SDK バージョンで変わりうるため、最新 SDK の1本のみを正とする
      - name: Format check
        if: matrix.format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze (fail on infos)
        run: dart analyze --fatal-infos
      - name: Test
        if: ${{ hashFiles('test/**/*_test.dart') != '' }}
        run: flutter test

  example-android:
    needs: changes
    if: needs.changes.outputs.example == 'true' || needs.changes.outputs.package == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.x', cache: true }
      - run: cd example && flutter pub get && flutter build apk
      - uses: actions/upload-artifact@v4
        with:
          name: example-android-apk
          path: example/build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  # macOS ランナーは高コストなため、リリース経路（main 向け PR）・iOS/依存の変更時・手動実行に限定する
  example-ios:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.base_ref == 'main' ||
      github.ref == 'refs/heads/main' ||
      needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.47.x', cache: true }
      - run: cd example && flutter pub get && flutter build ios --debug --simulator

  # 公開直前の経路（main 向け PR / main への push）と手動実行でのみ検証する
  publish-dry-run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.base_ref == 'main' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Dry run publish (fail on warnings)
        run: |
          # Actions の既定シェルは bash -e のため、dry-run が失敗した時点でステップは終了する
          set -o pipefail
          dart pub publish --dry-run 2>&1 | tee /tmp/pub.txt

          # "Package has 1 warning." / "Package has 2 warnings." の双方に一致させる
          WARN=$(grep -Eo 'Package has [0-9]+ warning' /tmp/pub.txt | grep -Eo '[0-9]+' | head -n1)
          : "${WARN:=0}"  # 未取得なら0扱い

          echo "pub dry-run warnings: ${WARN}"
          if [ "$WARN" -gt 0 ]; then
            echo "::error::pub dry run reported ${WARN} warning(s)"
            exit 1
          fi

  gate:
    name: all checks passed
    needs: [changes, package, example-android, example-ios, publish-dry-run]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ensure all deps succeeded
        env:
          # paths-filter や if 条件でスキップされたジョブは skipped となり、失敗扱いにしない
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo 'Needs: ${{ toJson(needs) }}'
          if [[ "$FAILED" == "true" ]]; then
            echo "::error::One or more required jobs failed or were cancelled"
            exit 1
          fi
