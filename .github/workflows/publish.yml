name: Publish to pub.dev

on:
  push:
    # プレリリースを含むバージョンタグをpub.dev側のtag patternで検証する
    tags: ['v*']

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Verify tag commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Verify release version
        run: dart tool/verify_release.dart "${GITHUB_REF_NAME#v}"

      - run: flutter pub get

      # 公開物に警告が残っていないことを、公開対象のタグ SHA に対して確認する。
      # --force は確認を省略するだけで警告を消さないため、ここで止める。
      - name: Dry run publish (fail on warnings)
        run: |
          set -o pipefail
          flutter pub publish --dry-run 2>&1 | tee /tmp/pub.txt

          WARN=$(grep -Eo 'Package has [0-9]+ warning' /tmp/pub.txt \
            | grep -Eo '[0-9]+' | head -n1 || true)
          : "${WARN:=0}"

          echo "pub dry-run warnings: ${WARN}"
          if [ "$WARN" -gt 0 ]; then
            echo "::error::pub dry run reported ${WARN} warning(s)"
            exit 1
          fi

  publish:
    needs: verify
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pub.dev
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.1'
      - run: flutter pub get

      - name: Dry run publish (fail on warnings)
        run: |
          set -o pipefail
          flutter pub publish --dry-run 2>&1 | tee /tmp/pub.txt

          WARN=$(grep -Eo 'Package has [0-9]+ warning' /tmp/pub.txt \
            | grep -Eo '[0-9]+' | head -n1 || true)
          : "${WARN:=0}"

          echo "pub dry-run warnings: ${WARN}"
          if [ "$WARN" -gt 0 ]; then
            echo "::error::pub dry run reported ${WARN} warning(s)"
            exit 1
          fi

      - run: flutter pub publish --force

  release:
    timeout-minutes: 10
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Extract release notes
        run: >-
          dart tool/release_notes.dart "${GITHUB_REF_NAME#v}"
          > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_options=()
          if [[ "${GITHUB_REF_NAME#v}" == *-* ]]; then
            release_options+=(--prerelease --latest=false)
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "${release_options[@]}"

  merge-back:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Merge main back into develop
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_ACTOR: ${{ github.repository_owner }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # 公開したタグのコミットだけを取り込む。origin/main の先端を使うと、
          # 後続のリリースが進んでいた場合に別バージョンを巻き込む
          git fetch --no-tags origin \
            "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          release_sha="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")"
          echo "Merging published commit $release_sha"

          if git merge-base --is-ancestor "$release_sha" HEAD; then
            echo "develop already contains $GITHUB_REF_NAME. Nothing to do."
            exit 0
          fi

          if git merge --no-ff -m "chore: merge back $GITHUB_REF_NAME into develop" "$release_sha" \
            && git push origin develop; then
            echo "Merged $GITHUB_REF_NAME into develop."
            exit 0
          fi

          # 競合、またはブランチ保護により直接pushできない場合のフォールバック
          git merge --abort || true
          branch="chore/merge-back-$GITHUB_REF_NAME"
          git switch -c "$branch" "$release_sha"
          git push -u --force-with-lease origin "$branch"
          existing_pr="$(gh pr list --base develop --head "$branch" --state open --json number --jq 'length')"
          if [[ "$existing_pr" == "0" ]]; then
            gh pr create \
            --assignee "$RELEASE_ACTOR" \
            --base develop \
            --head "$branch" \
            --title "chore: merge back $GITHUB_REF_NAME into develop" \
            --body "自動マージバックに失敗したため、競合またはブランチ保護の確認が必要。"
          fi
          exit 1
